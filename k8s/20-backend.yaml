apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-backend
  namespace: nemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nemo-backend
  template:
    metadata:
      labels:
        app: nemo-backend
    spec:
      containers:
        - name: backend
          image: <registry>/nemo-backend:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nemo-backend-config
            - secretRef:
                name: nemo-backend-secret
          readinessProbe:
            httpGet:
              path: /api/v1/openapi.json
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/openapi.json
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-backend
  namespace: nemo
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: nemo-backend
