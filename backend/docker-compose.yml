version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=nemo_user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=nemo_db
      - POSTGRES_PORT=5432
    depends_on:
      - postgres
    volumes:
      - ./app:/app/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=nemo_db
      - POSTGRES_USER=nemo_user
      - POSTGRES_PASSWORD=123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
